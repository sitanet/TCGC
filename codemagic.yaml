workflows:
  ios-unsigned:
    name: Citygate iOS Build (No Apple Keys Needed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify GoogleService-Info.plist
        script: |
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist verified."
          else
            echo "GoogleService-Info.plist not found in repository."
          fi
      - name: Get Flutter dependencies
        script: |
          flutter packages get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Flutter build iOS (Unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Citygate-unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv Citygate-unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Citygate iOS Release (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TCGC Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.tcgc.tcgc"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Setup GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_BASE64" ]; then
            echo "Decoding GoogleService-Info.plist from environment variable..."
            echo "$GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          elif [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist found in repository."
          fi
      - name: Set up keychain to be used for codesigning
        script: |
          keychain initialize
      - name: Fetch signing files from Apple Developer Portal
        script: |
          app-store-connect fetch-signing-files "com.tcgc.tcgc" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificates in keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter packages get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - admin@thecitygatechurch.org
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
