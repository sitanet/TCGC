# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# JVM options
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=jks

# SSL/TLS settings
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
systemProp.javax.net.ssl.trustStoreType=jks

# Network settings
systemProp.http.keepAlive=true
systemProp.http.maxConnections=10
