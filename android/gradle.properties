# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# JVM options — force TLS 1.2 and disable hostname verification for Gradle downloads
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512M -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Djava.net.preferIPv4Stack=true

# Network settings
systemProp.http.socketTimeout=300000
systemProp.http.connectionTimeout=300000
systemProp.https.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
systemProp.java.net.preferIPv4Stack=true

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true

# R8 Full Mode (Google Play requirement)
android.enableR8.fullMode=true
android.enableR8=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
